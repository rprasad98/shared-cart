spring.application.name=demo

#db config
spring.datasource.url=jdbc:postgresql://localhost:5432/shared_cart_db
spring.datasource.username=raghavprasad
spring.datasource.password

#jpa config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

#used for db migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-version=0



# Set logging levels
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=INFO

# Configure logging pattern to include timestamp
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Optional: Save logs to a file


# Enable hot reload
spring.devtools.restart.enabled=true
# Optional: Exclude directories from triggering reload
spring.devtools.restart.exclude=static/**,public/**
# Optional: Additional paths to watch for changes
spring.devtools.restart.additional-paths=src/main/java
# Optional: Enable live reload (reloads the browser automatically)
spring.devtools.livereload.enabled=true